[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "haunt"
version = "0.1.0"
description = "Find the skills haunting your Claude Code context window."
readme = "README.md"
license = "MIT"
requires-python = ">=3.9"
authors = [{ name = "Khushal Davesar" }]
keywords = ["claude", "claude-code", "agent-skills", "mcp", "cli"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Environment :: Console",
  "Topic :: Software Development :: Quality Assurance",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/DavesarXKhushal/haunt"
Issues = "https://github.com/DavesarXKhushal/haunt/issues"

[project.scripts]
haunt = "haunt.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/haunt"]
